<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>Add medication – MediSync</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar app-top">
    <a class="logo" href="dashboard.html">MediSync</a>
    <div class="top-icons">
      <a class="icon-btn" href="settings-personal.html" title="Settings" aria-label="Settings">⚙</a>
      <a class="icon-btn" href="settings-notifications.html" title="Notifications" aria-label="Notifications">🔔</a>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" aria-label="Main">
        <a href="dashboard.html">Dashboard</a>
        <a href="calendar.html">Calendar</a>
        <a href="medications.html" class="active" aria-current="page">Medications</a>
        <a href="plan.html">Plan</a>
        <a href="settings-personal.html">Profile</a>
      <div class="sidebar-foot"><strong>Coral Parento</strong><span class="muted">Patient</span></div>
    </nav>

    <main class="content">
      <section class="view">
        <div class="seg"><a href="medications-add.html" class="active" aria-current="page">Add Medication</a><a href="medications.html">Medication Details</a><a href="medications-edit.html">Edit Medication</a></div>

        <div class="tab">
          <form class="form" action="medications.html">
            <label>Medication name<input name="name" required placeholder="e.g. Lagundi XForte" /></label>
            <label>Quantity per dose<input name="qty" type="number" min="1" value="1" /></label>
            <label>Times per day
              <select name="freq">
                <option value="1">Once a day</option>
                <option value="2">Twice a day</option>
                <option value="3" selected>3 times a day</option>
                <option value="4">4 times a day</option>
              </select>
            </label>
            <div class="times">
              <input name="t1" type="time" value="08:00" required aria-label="Dose 1 time" />
              <input name="t2" type="time" value="14:00" aria-label="Dose 2 time" />
              <input name="t3" type="time" value="20:00" aria-label="Dose 3 time" />
              <input name="t4" type="time" aria-label="Dose 4 time" />
            </div>
            <label>Notes<textarea name="notes" rows="3" placeholder="e.g. Take after meals"></textarea></label>
            <div class="btn-row left">
              <button class="btn primary" type="submit">Add Medication</button>
              <a class="btn light" href="medications.html">Cancel</a>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
