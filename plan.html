<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>Plan / Adhering – MediSync</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar app-top">
    <a class="logo" href="dashboard.html">MediSync</a>
    <div class="top-icons">
      <a class="icon-btn" href="settings-personal.html" title="Settings" aria-label="Settings">⚙</a>
      <a class="icon-btn" href="settings-notifications.html" title="Notifications" aria-label="Notifications">🔔</a>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" aria-label="Main">
        <a href="dashboard.html">Dashboard</a>
        <a href="calendar.html">Calendar</a>
        <a href="medications.html">Medications</a>
        <a href="plan.html" class="active" aria-current="page">Plan</a>
        <a href="settings-personal.html">Profile</a>
      <div class="sidebar-foot"><strong>Coral Parento</strong><span class="muted">Patient</span></div>
    </nav>

    <main class="content">
      <section class="view">
        <h2>Plan / Adhering</h2>
        <div class="stats">
          <div class="stat"><span>80%</span><small>7-day adherence</small></div>
          <div class="stat"><span>16</span><small>Doses taken</small></div>
          <div class="stat"><span>4</span><small>Doses missed</small></div>
        </div>
        <h3>Last 7 days</h3>
        <div class="bars">
          <div class="bar"><div style="height:100%"></div><span>Sat</span></div>
          <div class="bar"><div style="height:100%"></div><span>Sun</span></div>
          <div class="bar"><div style="height:100%"></div><span>Mon</span></div>
          <div class="bar"><div style="height:67%"></div><span>Tue</span></div>
          <div class="bar"><div style="height:33%"></div><span>Wed</span></div>
          <div class="bar"><div style="height:100%"></div><span>Thu</span></div>
          <div class="bar"><div style="height:50%"></div><span>Fri</span></div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
