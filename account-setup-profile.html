<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>Profile setup – MediSync</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section class="screen wave">
  <header class="topbar"><a class="logo" href="index.html">MediSync</a></header>
    <form class="setup" action="account-setup-optional.html">
      <div class="setup-head"><h3>Profile Setup</h3><a href="account-setup.html" class="back">Back</a></div>
      <div class="setup-panel">
        <input class="pill-input" name="name" placeholder="Name" aria-label="Name" required />
        <input class="pill-input" name="age" type="number" min="0" max="120" placeholder="Age" aria-label="Age" required />
      </div>
      <button class="btn primary center" type="submit">Next</button>
    </form>
  </section>
</body>
</html>
